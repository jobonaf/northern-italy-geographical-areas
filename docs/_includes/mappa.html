<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
#map{height:60vh;min-height:380px;border:1px solid #cfd8de;border-radius:6px;background:#dfe7ec}
.map-summary{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;margin:.7rem 0;font-size:.95rem}
.map-summary span{display:inline-flex;align-items:center;gap:.4rem}
.map-summary i{width:14px;height:14px;border-radius:3px;background:#1b7f79;display:inline-block}
</style>
<div id="map" role="application" aria-label="Mappa interattiva dei territori con confine definito"></div>
<div class="map-summary" aria-label="Sintesi della mappa">
  <span><i></i><strong id="mapped-count">0</strong> territori con confine definito</span>
  <span><strong id="pending-count">0</strong> territori ancora da definire, elencati nella tabella</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const data = {{ site.data.territori | jsonify }};
  const features = (data && data.features) || [];
  const mapped = features.filter(f => f.geometry);
  const pending = features.filter(f => !f.geometry);
  const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const issueUrl = p => {
    const title = `Segnalazione per: ${p.name || p.territory_id || "territorio"}`;
    const body = `## Tipo di segnalazione\n- [ ] Correzione dei comuni\n- [ ] Nuova fonte\n- [ ] Correzione delle note\n- [ ] Altro\n\n## Descrizione\n\n## Fonte o riferimento\n\n## Comuni interessati\n`;
    return `{{ site.repo_url }}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  };
  document.getElementById("mapped-count").textContent = mapped.length;
  document.getElementById("pending-count").textContent = pending.length;
  const map = L.map("map", {scrollWheelZoom:false}).fitBounds([[43.7,6.6],[47.1,13.9]]);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  if (!mapped.length) return;
  const layer = L.geoJSON({type:"FeatureCollection",features:mapped},{
    style:{color:"#1b7f79",weight:1.4,fillColor:"#1b7f79",fillOpacity:.38},
    onEachFeature:(f,l) => {
      const p=f.properties || {};
      const src=p.source || p.fonte || "";
      const sourceHtml=/^https?:\/\//.test(src) ? `<a href="${esc(src)}" target="_blank" rel="noopener">Fonte</a>` : esc(src);
      const details=[p.n_comuni ? `${esc(p.n_comuni)} comuni` : "", sourceHtml, p.notes ? esc(p.notes) : ""].filter(Boolean).join("<br>");
      l.bindPopup(`<strong>${esc(p.name || p.territory_id)}</strong>${details ? `<br>${details}` : ""}<br><a href="${issueUrl(p)}" target="_blank" rel="noopener">Segnala una modifica</a>`);
      l.on("mouseover",()=>l.setStyle({fillOpacity:.65}));
      l.on("mouseout",()=>l.setStyle({fillOpacity:.38}));
    }
  }).addTo(map);
  map.fitBounds(layer.getBounds(),{padding:[30,30]});
})();
</script>
